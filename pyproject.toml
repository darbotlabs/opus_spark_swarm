[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opus-spark-swarm"
version = "0.1.0"
description = "Claude Opus 4.6 powered AG2 agent swarm for autonomous business analysis"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "autogen-agentchat>=0.4.0",
    "autogen-ext[openai]>=0.4.0",
    "litellm>=1.40.0",
    "httpx>=0.24.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "nbformat>=5.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "respx>=0.21.0",
]
docs = [
    "pdfplumber>=0.10.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
]

[project.scripts]
opus-spark-swarm = "opus_spark_swarm.main:cli"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
